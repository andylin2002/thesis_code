# config.yaml

### --- LOOP --- ###
LOOP: False

### --- TIME --- ###
TIME: False

### --- Threads --- ###
RUN_SYM: True
RUN_NEU: True

### --- System Mode --- ###
#SYSTEM_MODE: 'BASELINE'
SYSTEM_MODE: 'PROPOSED'

### --- Environment & Trajectory --- ###
DATASET_FOLDER: "dataset_office_8AP"
ENV_CONFIG: "env_config.yaml"
HMATRIX_LIST:
  - "t150_ch106_ant3"

# --- Grid Generation Parameters ---
GRID_RESOLUTION_M: 0.5
BUFFER_DISTANCE_M: 0

### --- 2. System Setup --- ###
CSI_DIMENSIONS:
  NUM_RX_ANTENNAS: 3                      # notation: N
  NUM_SUBCARRIERS: 21                     # notation: M
  
# --- Frequency & Inter-element Spacing ---
CARRIER_FREQUENCY_HZ: 5530000000.0        # center frequency
CHANNEL_BANDWIDTH_HZ: 80000000.0          # notation: B
ANTENNA_DISTANCE: 0.0273                  # notation: d

# --- Packeting & Aggregation ---
NUM_SAMPLE: 20                            # notation: T
NUM_PACKET: 1                             # notation: P

# --- Baseline Angle Extractor ---
BASELINE_AOA_METHOD: 'mmp'              # 'music' or 'mmp'

### --- 3. neural_worker Setup --- ###
NEURAL_SLEEP: 0.05
NEURAL_BATCH_SIZE: 16
NEURAL_UPDATE_INTERVAL: 1
NEURAL_SAVE_INTERVAL: 1
NEURAL_MIN_UPDATES: 0

# --- 4. Model Setup --- ###
LR: 5e-4
EMBED_DIM: 16
CONTRASTIVE_TAU: 0.07
CONSENSUS_WEIGHT: 0.5

C_MAX_TAPS: 16
DATA_AUG: False
AUG_SUB_RATIO: 0.2

### --- 5. Gating Setup --- ###
GATING_TEMP: 0.002