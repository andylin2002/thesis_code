# config.yaml

### --- LOOP --- ###
LOOP: False

### --- System Mode --- ###
#SYSTEM_MODE: 'BASELINE'
SYSTEM_MODE: 'PROPOSED'

### --- Environment & Trajectory --- ###
DATASET_FOLDER: "dataset_office_8AP"
ENV_CONFIG: "env_config.yaml"
HMATRIX_LIST:
  - "train_wander" #NLoS_t150_ch36_ant3, train_direct, NLoS_t799_ch36_ant3, train_wander

### --- Grid Generation Parameters --- ###
GRID_RESOLUTION_M: 0.5
BUFFER_DISTANCE_M: 0

### --- 2. System Setup --- ###
CSI_DIMENSIONS:
  NUM_RX_ANTENNAS: 3                      # notation: N
  NUM_SUBCARRIERS: 21                     # notation: M       ch36: 21,       ch106: 81
  
### --- Frequency & Inter-element Spacing --- ###
CARRIER_FREQUENCY_HZ: 5180000000.0        # center frequency  ch36: 518,      ch106: 553
CHANNEL_BANDWIDTH_HZ: 20000000.0          # notation: B       ch36: 20,       ch106: 80
ANTENNA_DISTANCE: 0.02899                  # notation: d       ch36: 0.02899,  ch106: 0.0273

### --- Packeting & Aggregation --- ###
NUM_SAMPLE: 15                            # notation: T
NUM_PACKET: 1                             # notation: P

### --- Ablation Study --- ###
BASELINE_AOA_METHOD: 'mmp'              # 'music' or 'mmp'
USE_SOFT_EM: True
USE_TOF_GAIN_WEIGHT: True
USE_NEURAL: True

### --- neural worker / runtime --- ###
NEURAL_SLEEP: 0.05
NEURAL_BATCH_SIZE: 32
NEURAL_WINDOW_SIZE: 16
NEURAL_WINDOW_STRIDE: 1
NEURAL_SEQUENCE_BUFFER_CAPACITY: 128

NEURAL_UPDATES_PER_BATCH: 50

NEURAL_UPDATE_INTERVAL: 5
NEURAL_SAVE_INTERVAL: 50
NEURAL_MIN_UPDATES: 20

### --- debug --- ###
SAVE_NEURAL_DEBUG: true
NEURAL_DEBUG_DIR: output/neural_debug
NEURAL_DEBUG_SAVE_INTERVAL: 1

### --- model --- ###
NEURAL_CNN_CHANNELS: [16, 32]
NEURAL_CNN_KERNEL_SIZE: 3

NEURAL_TEMPORAL_DIM: 64
NEURAL_TCN_KERNEL_SIZE: 3
NEURAL_TCN_DILATIONS: [1, 2, 4]

NEURAL_NUM_HEADS: 4
NEURAL_AP_NUM_LAYERS: 2
NEURAL_AP_FF_HIDDEN: 128

NEURAL_EMBED_DIM: 128
NEURAL_EMBED_HIDDEN: 64
NEURAL_HEAD_HIDDEN: 64

NEURAL_DROPOUT: 0.0

### --- optimization --- ###
LR: 0.01
WEIGHT_DECAY: 0.0001
GRAD_CLIP_NORM: 1.0

PROXY_LOSS_TYPE: huber
HUBER_BETA: 1.0

LOSS_WEIGHT_PROXY: 1.0
LOSS_WEIGHT_MANIFOLD: 0.0
LOSS_WEIGHT_SMOOTH: 0.0

### --- manifold --- ###
MANIFOLD_POS_K: 3
MANIFOLD_NEG_K: 3
MANIFOLD_MIN_POS_SIM: 0.2
MANIFOLD_MAX_NEG_SIM: -0.1
MANIFOLD_NEG_MARGIN: 0.2

LOSS_WEIGHT_TOP1: 0.3
LOSS_WEIGHT_RANK: 0.1

RANK_MARGIN: 0.05
RANK_TEACHER_GAP_THRESHOLD: 0.1
RANK_MAX_PAIRS: 8

TEACHER_TEMPERATURE: 1.0
STUDENT_TEMPERATURE: 1.0
TEACHER_STD_FLOOR: 1e-4


# DEBUG
ACCESS_POINTS:
  - ap1
  - ap2
  - ap3
  - ap4
  - ap5
  - ap6
  - ap7
  - ap8