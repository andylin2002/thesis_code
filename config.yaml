# config.yaml

### --- LOOP --- ###
LOOP: False

### --- TIME --- ###
TIME: False

### --- Threads --- ###
RUN_SYM: True
RUN_NEU: True

### --- System Mode --- ###
#SYSTEM_MODE: 'BASELINE'
SYSTEM_MODE: 'PROPOSED'

### --- Environment & Trajectory --- ###
DATASET_FOLDER: "dataset_office_8AP"
ENV_CONFIG: "env_config.yaml"
HMATRIX_LIST:
  - "NLoS_t150_ch36_ant3" #NLoS_t150_ch36_ant3, train_direct, NLoS_t799_ch36_ant3

### --- Grid Generation Parameters --- ###
GRID_RESOLUTION_M: 0.5
BUFFER_DISTANCE_M: 0

### --- 2. System Setup --- ###
CSI_DIMENSIONS:
  NUM_RX_ANTENNAS: 3                      # notation: N
  NUM_SUBCARRIERS: 21                     # notation: M       ch36: 21,       ch106: 81
  
### --- Frequency & Inter-element Spacing --- ###
CARRIER_FREQUENCY_HZ: 5180000000.0        # center frequency  ch36: 518,      ch106: 553
CHANNEL_BANDWIDTH_HZ: 20000000.0          # notation: B       ch36: 20,       ch106: 80
ANTENNA_DISTANCE: 0.02899                  # notation: d       ch36: 0.02899,  ch106: 0.0273

### --- Packeting & Aggregation --- ###
NUM_SAMPLE: 15                            # notation: T
NUM_PACKET: 1                             # notation: P

### --- Ablation Study --- ###
BASELINE_AOA_METHOD: 'mmp'              # 'music' or 'mmp'
USE_SOFT_EM: True
USE_TOF_GAIN_WEIGHT: True

### --- 3. neural_worker Setup --- ###
NEURAL_SLEEP: 0.05
NEURAL_BATCH_SIZE: 16
NEURAL_UPDATE_INTERVAL: 1
NEURAL_SAVE_INTERVAL: 1
NEURAL_MIN_UPDATES: 0

# ===== Existing debug save =====
SAVE_NEURAL_DEBUG: true
NEURAL_DEBUG_DIR: output/neural_debug
NEURAL_DEBUG_SAVE_INTERVAL: 1

LATENT_DIM: 128
LR: 0.001
GRAD_CLIP_NORM: 1.0

LOSS_WEIGHT_CONS: 0.1
LOSS_WEIGHT_RANK: 1.0

SUBCARRIER_KEEP_RATIO: 0.85
FEATURE_DROPOUT_PROB: 0.05
AMPLITUDE_JITTER_STD: 0.02
PHASE_JITTER_STD: 0.01

RANK_MARGIN: 0.05
RANK_GAP_THRESHOLD: 0.05

PROXY_ALPHA: 1.0
PROXY_BETA: 0.5
PROXY_GAMMA: 0.0

RELIABILITY_HEAD_HIDDEN: 64
RELIABILITY_HEAD_DROPOUT: 0.1

NEURAL_CNN_CHANNELS: [16, 32]
NEURAL_CNN_KERNEL_SIZE: 3
NEURAL_TCN_HIDDEN: 64
NEURAL_TCN_KERNEL_SIZE: 3
NEURAL_TCN_DILATIONS: [1, 2, 4]
NEURAL_MLP_HIDDEN: 64
NEURAL_DROPOUT: 0.1
PROJ_DIM: 64